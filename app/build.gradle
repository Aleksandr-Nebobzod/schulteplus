plugins {
    // Add the Crashlytics Gradle plugin
    id 'com.google.firebase.crashlytics'
    // Make sure that you have the Google services Gradle plugin
    id 'com.google.gms.google-services'
    id 'com.android.application'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // Roborazzi: JVM-рендер Compose-превью (SP-03) — версия в корневом build.gradle
    id 'io.github.takahirom.roborazzi'
}

//configurations.all {
//    resolutionStrategy { force 'androidx.browser:browser:1.4.0' }
//}

configurations.all {
    // 240831 by Google announcement
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
}

android {
    namespace 'org.nebobrod.schulteplus'
    compileSdk 37


    defaultConfig {
        applicationId "org.nebobrod.schulteplus"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 120
        versionName "Entada"
        signingConfig signingConfigs.debug
        buildConfigField 'boolean', 'ENABLE_CRASHLYTICS', 'true'
        buildConfigField 'boolean', 'DEBUGGING', 'false'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    android.applicationVariants.all { variant ->
        def mergedFlavor = variant.getMergedFlavor()
        mergedFlavor.manifestPlaceholders = [appPackageId: "org.nebobrod.schulteplus"]
    }

/*    flavorDimensions "config"

    productFlavors {
        standard {
            dimension "config"
            buildConfigField "boolean", "ENABLE_SUBCLASSES", "true"
        }
        // Allows to exclude inner classes at configuration run (for ORMLite)
        standardNoSubclasses {
            dimension "config"
            buildConfigField "boolean", "ENABLE_SUBCLASSES", "false"
        }
    }*/

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            resValue "string", "firestore_root", "spdbs/test/"
            versionNameSuffix ""
            resValue "string", "app_version_num", "${defaultConfig.versionCode}"
            resValue "string", "app_version_full", "${defaultConfig.versionCode}${"_"}${defaultConfig.versionName}${versionNameSuffix}"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            resValue "string", "firestore_root", "spdbs/dev/"
//            resValue "string", "firestore_root", "spdbs/test/"
            versionNameSuffix "_alpha"
            resValue "string", "app_version_num", "${defaultConfig.versionCode}"
            resValue "string", "app_version_full", "${""}${defaultConfig.versionCode}${"_"}${defaultConfig.versionName}${versionNameSuffix}"
            buildConfigField 'boolean', 'ENABLE_CRASHLYTICS', 'false'
            buildConfigField 'boolean', 'DEBUGGING', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        applicationVariants.all { variant ->
            variant.outputs.each {
                output -> String projectName = getRootProject().name
                    String versionCode = "${""}${defaultConfig.versionCode}${"_"}${defaultConfig.versionName}"
                output.outputFileName = projectName + "_" + versionCode + ".apk"
            }
        }
    }
    compileOptions {
 //       sourceCompatibility JavaVersion.VERSION_1_8
 //       targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
        compose true
    }
    testOptions {
        unitTests {
            // Robolectric (Roborazzi): ресурсы и R-класс доступны в unit-тестах
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'jp.wasabeef:richeditor-android:2.0.0'
    /*implementation 'com.codevblocks.android:knob:1.0.1' */    // it's nice but only circle manipulated
    implementation "com.kizitonwose.calendar:view:2.10.1"
//    implementation 'org.webjars.bower:calendar-heatmap:0.4.1'
//    implementation 'com.github.EudyContreras:Calendar-HeatMap:v0.1'

    implementation "androidx.viewpager2:viewpager2:1.1.0"

    implementation project(':shared')

    implementation 'com.github.bumptech.glide:glide:4.16.0'     // for anim GIF in Basics
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'   // SSSR charts (SssrActivity) — миграция в треке B
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'androidx.activity:activity:1.13.0' // for ActivityResultLauncher for Google Auth
    implementation 'androidx.fragment:fragment:1.8.9'

    // provides google sign-up and log-in (googleid был мёртвым кодом — удалён в B2)
    implementation 'com.google.android.gms:play-services-auth:19.0.0'   // 16.0.0 → краш Google-входа (SignInHubActivity наследует android.support.v4.app.FragmentActivity, отсутствующий в APK; фикс 16.08.2026); «240805» — дата 2024-08-05, текст ошибки не задокументирован (см. D-22)

    implementation 'com.google.android.play:app-update:2.1.0'

    implementation 'com.google.android.gms:play-services-oss-licenses:17.5.1'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'

//    implementation 'com.github.Innovattic:range-seek-bar:v1.0.8'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation("com.google.firebase:firebase-crashlytics:19.0.3")
    implementation("com.google.firebase:firebase-analytics:22.0.2") {
        exclude group: 'com.google.android.gms', module: 'play-services-measurement-api'
    }

    implementation 'com.google.firebase:firebase-firestore:25.0.0'
//    implementation 'com.google.firebase:firebase-database:20.3.1'
    implementation 'com.google.firebase:firebase-auth:20.0.3' // v119 фактически работал на 20.0.3 (транзитив firebase-ui-auth, highest-wins); 16.0.3 ссылается на удалённый в common 21 класс (NoClassDefFoundError); 23.0.0 — error 240805
    implementation 'com.j256.ormlite:ormlite-android:6.1'

    // Compose (B2: авторизация на Compose; XML-экраны не трогаем)
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'   // согласовано с play-services-oss-licenses 17.5.1 (тянет 1.13.0 транзитивно); m3_comp_* ресурсы заменены на M3-эквиваленты (styles.xml)
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.preference:preference:1.2.1'

    // Unit test section
    testImplementation 'junit:junit:4.13.2'
    /*https://mvnrepository.com/artifact/org.mockito/mockito-core*/
//    testImplementation 'org.mockito:mockito-core:4.0.0'

    // Roborazzi + Robolectric: JVM-рендер Compose-превью в PNG (SP-03 дизайн-макеты, app/src/test/kotlin/.../designpreview)
    // Рендер: ./gradlew recordRoborazziDebug → PNG в temp/design-preview/ (путь задан в StartScreensPreviewTest)
    testImplementation platform('androidx.compose:compose-bom:2026.06.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.72.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:1.72.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.72.0"
    testImplementation 'org.robolectric:robolectric:4.16.1'

    // Instrument test section
    androidTestImplementation 'androidx.test:rules:1.5.0'
//    androidTestImplementation 'org.mockito:mockito-core:4.0.0'
    androidTestImplementation 'org.mockito:mockito-android:4.0.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //Dagger - Hilt
//    implementation "com.google.dagger:hilt-android:2.42"
//    Gradle: javax.inject:javax.inject:1 (javax.inject-1.jar)
//    kapt "com.google.dagger:hilt-android-compiler:2.42"
}