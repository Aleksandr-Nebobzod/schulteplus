<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обучение</title>
<!--    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">-->
    <link rel="stylesheet" href="file:///android_asset/common/swiper-bundle.min.css">
    <link rel="stylesheet" href="file:///android_asset/common/add_styles.css">
</head>

<body>

<!-- Swiper Container -->
<div class="swiper-container">
    <div class="swiper-wrapper">

        <!-- Slide 1 -->
        <div class="swiper-slide">
            <img src="file:///android_asset/common/ic_badge_psycoin.svg" style="max-width: 30%; display: block; margin: 0 auto;" alt="Пси-монеты">
            <h1>
                Цена: <span id="price"></span>
            </h1>
            <p>
                <b>-- пси-монет за доступ к упражнению.</b>
            </p>

            <h1>
                Бюджет: <span id="budget"></span></p>
            </h1>
            <p>
                <b>-- пси-монет всего на балансе.</b>
            </p>

            <div class="question">
                <p>Готовы ли вы инвестировать пси-монеты:</p>
                <label><input type="checkbox" data-correct="false"> Нет, буду тренироваться на доступных упраженниях и копить пси-монеты</label>
                <label><input type="checkbox" data-correct="true"> Да, я вложу свои сбережения в новые возможности.</label>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="swiper-pagination"></div>
    <!-- Navigation -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
</div>

<!-- Swiper JS -->
<script src="file:///android_asset/common/swiper-bundle.min.js"></script>
<!--  checkAllResults() and checkAllAnswered()-->
<script src="file:///android_asset/common/test-check.js"></script>

<script type="text/javascript">
    function setPsyData(price, budget) {
        document.getElementById("price").innerText = price;
        document.getElementById("budget").innerText = budget;
    }
</script>

</body>
</html>
